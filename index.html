            ],
            grade8: [
                { title: 'องค์ประกอบสารละลายและสภาพละลายได้', subTitle: 'Solutions & Solubility', img: 'm2 term1/1Solutions/pic.jpg', link: 'm2 term1/1Solutions/index.html' },
                { title: 'ระบบอวัยวะในร่างกายของเรา', subTitle: 'Organ Systems in Human Body', img: 'm2 term1/2Organ Systems/pic.jpg', link: 'm2 term1/2Organ Systems/index.html' },
                { title: 'การเคลื่อนที่และแรง', subTitle: 'Motion & Force', img: 'm2 term1/3Motion/pic.jpg', link: 'm2 term1/3Motion/index.html' },
                { title: 'เตรียมสอบ ม.2 เทอม 1', subTitle: 'Term 1 Final Exam', img: 'm2 term1/4สอบกลางภาค/pic.jpg', link: 'm2 term1/4สอบกลางภาค/index.html' },
                { title: 'งาน พลังงาน และเครื่องกลอย่างง่าย', subTitle: 'Work, Energy & Machines', img: 'm2 term2/1Work and energy/pic.jpg', link: 'm2 term2/1Work and energy/index.html' },

                { title: 'เตรียมสอบปลายภาค', subTitle: 'Term 2 Final Exam', img: 'm2 term2/5Term 2 Comprehensive Final Exam/pic.jpg', link: 'm2 term2/5Term 2 Comprehensive Final Exam/index.html' },

            ],

                { title: 'เตรียมสอบ ม.3 เทอม 1', subTitle: 'Term 1 Final Exam', img: 'm3 term1/ฝึกทำข้อสอบเตรียมสอบกลางภาค/pic.jpg', link: 'm3 term1/ฝึกทำข้อสอบเตรียมสอบกลางภาค/index.html' },
                { title: 'ปฏิกิริยาเคมีและวัสดุในชีวิตประจำวัน', subTitle: 'Chemical Reactions & Materials', img: 'm3 term2/1Chemical/pic.jpg', link: 'm3 term2/1Chemical/index.html' },
                { title: 'ไฟฟ้า', subTitle: 'Electricity', img: 'm3 term2/2Electricity/pic.jpg', link: 'm3 term2/2Electricity/index.html' },
                { title: 'ระบบนิเวศและความหลากหลายทางชีวภาพ ', subTitle: 'Ecosystems & Biodiversity', img: 'm3 term2/3Ecosystems/pic.jpg', link: 'm3 term2/3Ecosystems/index.html' },
                { title: 'เตรียมสอบปลายภาค', subTitle: 'Term 2 Final Exam', img: 'm3 term2/4Final Exam/pic.jpg', link: 'm3 term2/4Final Exam/index.html' },
                { title: 'แนวข้อสอบ O-NET', subTitle: 'O-NET', img: 'm3 term2/5onet/pic.jpg', link: 'm3 term2/5onet/index.html' },
                { title: 'ติวสอบเข้า ม.4', subTitle: 'Entrance exam for grade 10 (M.4)', img: 'm3 term2/คลังข้อสอบวิทย์เข้า ม.4/pic.jpg', link: 'm3 term2/คลังข้อสอบวิทย์เข้า ม.4/index.html' },

            ]

        // 2. ฟังก์ชันสร้าง HTML สำหรับ Block Card 1 ใบ
        function createCardHTML(card) {
            const cardInnerHTML = `
                <div class="card-glow bg-[#080811] rounded-2xl p-3 flex flex-col gap-2">
                    <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-gray-900">
                        <img src="${card.img}" alt="${card.title}"
                            class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
                            onerror="handleImageError(this, '${card.title}')">
                    </div>
                    <div class="pt-1">
                        <h3 class="font-bold text-base text-white leading-tight">${card.title}</h3>
                        <p class="text-xs text-purple-300/80 font-light mt-0.5">${card.subTitle}</p>
                    </div>
                </div>
            `;

            // ถ้ามีลิงก์ ให้ครอบด้วย <a> tag ถ้าไม่มีให้แสดงแค่ <div>
            if (card.link) {
                return `<a href="${card.link}" target="_blank" class="card-link block">${cardInnerHTML}</a>`;
            }
            return cardInnerHTML;
        }

        // 3. ฟังก์ชัน วาด (Render) Card ทั้งหมดลงใน Container ของแต่ละระดับชั้น
        function renderAllCards() {
            document.getElementById('grade-7-container').innerHTML = cardsData.grade7.map(createCardHTML).join('');
            document.getElementById('grade-8-container').innerHTML = cardsData.grade8.map(createCardHTML).join('');
            document.getElementById('grade-9-container').innerHTML = cardsData.grade9.map(createCardHTML).join('');
        }

        // 4. ฟังก์ชันจัดการเมื่อรูปภาพเกิด Error (Fallback)
        function handleImageError(imgElement, titleText) {
            imgElement.onerror = null;
            const svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
                    <defs>
                        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#120c24"/>
                            <stop offset="100%" stop-color="#080511"/>
                        </linearGradient>
                        <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#8b5cf6"/>
                            <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#bg)"/>
                    <circle cx="300" cy="140" r="45" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
                    <path d="M285 140 L315 140 M300 125 L300 155" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
                    <rect x="40" y="240" width="520" height="2" fill="url(#accent)" opacity="0.4"/>
                    <text x="300" y="220" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">
                        ${escapeXml(titleText)}
                    </text>
                    <text x="300" y="280" font-family="sans-serif" font-size="13" fill="#8b5cf6" text-anchor="middle" letter-spacing="2">
                        DEK MORTON STUDIO
                    </text>
                </svg>
            `;
            imgElement.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgContent);
        }

        function escapeXml(unsafe) {
            return unsafe.replace(/[<>&'"]/g, function (c) {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        // เริ่มแสดงผลเมื่อโหลดหน้าเว็บเรียบร้อย
        document.addEventListener('DOMContentLoaded', renderAllCards);
    </script>
    <script>
        (function () {
            const btn = document.getElementById('support-btn');
            const pupilLeft = document.getElementById('pupil-left');
            const pupilRight = document.getElementById('pupil-right');

            let sleepTimer = null;
            const SLEEP_DELAY = 3000; // เวลาเมาส์นิ่ง (3000ms = 3 วินาที) แล้วจะหลับ

            // ฟังก์ชั่นรีเซ็ตการหลับ (ปลุกให้ตื่น)
            function wakeUp() {
                btn.classList.remove('smiley-asleep-mode');
                clearTimeout(sleepTimer);

                // ตั้งเวลาถ้าไม่มีการขยับเมาส์จะหลับตา
                sleepTimer = setTimeout(() => {
                    btn.classList.add('smiley-asleep-mode');
                }, SLEEP_DELAY);
            }

            // คำนวณตำแหน่งองศาตาดำให้มองตามเมาส์
            document.addEventListener('mousemove', (e) => {
                wakeUp();

                if (!pupilLeft || !pupilRight || !btn) return;

                const rect = btn.getBoundingClientRect();
                // จุดศูนย์กลางของปุ่ม
                const btnCenterX = rect.left + rect.width / 2;
                const btnCenterY = rect.top + rect.height / 2;

                // ระยะห่างระหว่างเมาส์กับปุ่ม
                const deltaX = e.clientX - btnCenterX;
                const deltaY = e.clientY - btnCenterY;
                const angle = Math.atan2(deltaY, deltaX);

                // ขอบเขตการกลอกตา (สูงสุด 3.5px)
                const distance = Math.min(3.5, Math.hypot(deltaX, deltaY) / 30);
                const pupilX = Math.cos(angle) * distance;
                const pupilY = Math.sin(angle) * distance;

                // ปรับตำแหน่งตาดำซ้าย-ขวา
                pupilLeft.setAttribute('cx', 35 + pupilX);
                pupilLeft.setAttribute('cy', 40 + pupilY);
                pupilRight.setAttribute('cx', 65 + pupilX);
                pupilRight.setAttribute('cy', 40 + pupilY);
            });

            // เริ่มต้นนับเวลาหลับตา
            wakeUp();
        })();
    </script>
